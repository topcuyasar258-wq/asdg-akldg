name: Günlük Lead Taraması

on:
  schedule:
    # Her gün 06:00 UTC = 09:00 Türkiye saati
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil adı (boş bırakılırsa günün profili çalışır)"
        required: false
      query:
        description: "Tek seferlik özel arama (örn: 'kafe Moda İstanbul')"
        required: false
      dry_run:
        description: "Test modu: WhatsApp göndermeden konsola yaz"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-run / eşzamanlı çalışmalarda bile en güncel "görülmüşler" listesiyle
      # başla ki aynı işletmeler ikinci kez bildirilmesin
      - name: Güncel durum dosyasını al
        run: |
          git fetch origin ${{ github.ref_name }} || true
          git checkout FETCH_HEAD -- data/seen.json 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Taramayı çalıştır
        env:
          # Opsiyonel — tanımlı değilse ücretsiz tarayıcı modu kullanılır
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.profile }}" ]; then
            ARGS="--profile ${{ github.event.inputs.profile }}"
          elif [ -n "${{ github.event.inputs.query }}" ]; then
            ARGS="--query \"${{ github.event.inputs.query }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python main.py $ARGS

      - name: Durum dosyasını commitle (tekrar bildirimi engelle)
        run: |
          git config user.name "lead-bot"
          git config user.email "bot@veridiareklam.com.tr"
          git add data/seen.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: günlük tarama durum güncellemesi ($(date +%F))"
          if git push origin HEAD:${{ github.ref_name }}; then
            exit 0
          fi
          # Dal bu sırada ilerlediyse: uzak seen.json ile bizimkini birleştir
          cp data/seen.json /tmp/local_seen.json
          git fetch origin ${{ github.ref_name }}
          git reset --hard FETCH_HEAD
          python - <<'PY'
          import json
          remote = json.load(open("data/seen.json"))
          local = json.load(open("/tmp/local_seen.json"))
          remote.update(local)
          with open("data/seen.json", "w", encoding="utf-8") as f:
              json.dump(remote, f, ensure_ascii=False, indent=1, sort_keys=True)
          PY
          git add data/seen.json
          git commit -m "chore: günlük tarama durum güncellemesi ($(date +%F), birleştirildi)"
          git push origin HEAD:${{ github.ref_name }}
